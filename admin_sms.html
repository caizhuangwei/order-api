<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f5f6fa">
<title>短信订单管理面板</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 16px 14px 40px;
    background: #f5f6fa;
    color: #222;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== 密码遮罩 ========== */
  #auth-mask {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    padding: 20px;
  }
  .auth-card {
    background: #fff;
    border-radius: 16px;
    padding: 28px 24px 22px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 10px 40px rgba(0,0,0,.2);
    text-align: center;
  }
  .auth-card h3 { font-size: 18px; color: #222; margin: 0 0 6px; font-weight: 700; }
  .auth-tip { font-size: 13px; color: #888; margin: 0 0 18px; }
  .auth-card input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #d9d9d9;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    background: #fafbfc;
    transition: border-color .15s;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  .auth-card input[type="password"]:focus { border-color: #11998e; background: #fff; }
  .auth-remember {
    display: flex; align-items: center; justify-content: flex-start;
    gap: 6px; font-size: 13px; color: #666; margin-bottom: 16px;
    cursor: pointer; user-select: none;
  }
  .auth-remember input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: #11998e; cursor: pointer; margin: 0;
  }
  .auth-card .auth-btn {
    width: 100%; padding: 12px;
    background: #11998e; color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background .15s, transform .1s; min-height: 46px;
  }
  .auth-card .auth-btn:hover { background: #0d7a72; }
  .auth-card .auth-btn:active { transform: scale(0.98); }
  .auth-error { color: #d93025; font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* ========== 主页面 ========== */
  h1 { font-size: 20px; margin: 0 0 16px; color: #1a1a1a; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h2 { font-size: 16px; margin: 0; color: #222; font-weight: 700; }

  .panel {
    background: #fff; border-radius: 14px; padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05); margin-bottom: 16px;
  }
  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; margin-bottom: 12px;
  }

  textarea {
    width: 100%; height: 140px; padding: 12px;
    border: 1px solid #d9d9d9; border-radius: 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.5; resize: vertical; outline: none;
    background: #fafbfc; transition: border-color .15s;
  }
  textarea:focus { border-color: #11998e; background: #fff; }

  .input-single {
    width: 100%; padding: 12px;
    border: 1px solid #d9d9d9; border-radius: 10px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.5; outline: none;
    background: #fafbfc; transition: border-color .15s;
  }
  .input-single:focus { border-color: #11998e; background: #fff; }

  button {
    padding: 9px 16px; cursor: pointer; border: none;
    background: #11998e; color: #fff; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    transition: background .15s, transform .1s;
    white-space: nowrap; min-height: 38px;
  }
  button:disabled { background: #9aa0a6; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #0d7a72; }
  button:active:not(:disabled) { transform: scale(0.97); }

  .btn-link {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    padding: 9px 16px; background: #7c3aed; color: #fff; border-radius: 8px;
    font-size: 13px; font-weight: 600; text-decoration: none;
    transition: background .15s, transform .1s; min-height: 38px;
    white-space: nowrap; cursor: pointer;
  }
  .btn-link:hover { background: #6d28d9; }
  .btn-link:active { transform: scale(0.97); }
  .btn-link.gray { background: #5f6368; }
  .btn-link.gray:hover { background: #494c50; }
  .btn-link.records-link { background: #7c3aed; }
  .btn-link.records-link:hover { background: #6d28d9; }

  .btn-copy-all { background: #0f9d58; }
  .btn-copy-all:hover:not(:disabled) { background: #0b8043; }
  .btn-danger { background: #d93025; }
  .btn-danger:hover:not(:disabled) { background: #b31412; }
  .btn-secondary { background: #5f6368; }
  .btn-secondary:hover:not(:disabled) { background: #494c50; }

  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .tip { color: #888; font-size: 12.5px; margin-top: 10px; line-height: 1.6; }
  .tip code {
    background: #f0f2f5; padding: 1px 5px; border-radius: 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace; color: #d93025;
  }
  .empty-tip {
    color: #999; font-size: 14px; padding: 30px 10px; text-align: center;
    background: #fafbfc; border-radius: 10px;
  }

  .main-grid {
    display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start;
  }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

  .order-card {
    background: #fafbfc; border: 1px solid #eef1f5; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px;
    display: flex; flex-direction: column; gap: 8px;
    transition: opacity .2s, background .2s;
  }
  .order-card:last-child { margin-bottom: 0; }
  .order-card.released { background: #f5f5f5; opacity: 0.65; }
  .order-card.released .link-box { text-decoration: line-through; color: #999; }

  .order-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap;
  }
  .phone {
    font-weight: 700; font-size: 15px; color: #222;
    font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.5px;
  }
  .time-badge { font-size: 12px; color: #999; font-weight: normal; }
  .released-badge {
    display: inline-block; font-size: 11px; background: #ffebee; color: #c62828;
    padding: 2px 8px; border-radius: 10px; font-weight: 600; margin-left: 6px;
  }
  .pwd-badge {
    display: inline-block; font-size: 11.5px; background: #e8f5e9; color: #0f9d58;
    padding: 2px 8px; border-radius: 10px; font-weight: 600;
    font-family: ui-monospace, Menlo, Consolas, monospace; letter-spacing: .5px;
  }

  .link-box {
    font-size: 12.5px; color: #11998e;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    background: #fff; border: 1px solid #eef1f5;
    padding: 8px 10px; border-radius: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    word-break: break-all;
  }

  .card-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .card-actions button {
    padding: 7px 12px; font-size: 12.5px; min-height: 34px; border-radius: 8px;
  }
  .btn-copy { background: #34a853; }
  .btn-copy:hover:not(:disabled) { background: #2d9249; }
  .btn-open { background: #ea4335; }
  .btn-open:hover:not(:disabled) { background: #d33828; }
  .btn-release { background: #f57c00; }
  .btn-release:hover:not(:disabled) { background: #e65100; }
  .btn-release:disabled { background: #cfd8dc; color: #666; }

  .scroll-box { max-height: 640px; overflow-y: auto; padding-right: 4px; }
  .scroll-box::-webkit-scrollbar { width: 6px; }
  .scroll-box::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 3px; }

  .collapsible-header {
    cursor: pointer; user-select: none; margin-bottom: 0;
    padding: 4px 2px; transition: background .15s; border-radius: 8px;
  }
  .collapsible-header:hover { background: #fafbfc; }
  .collapsible-header h2 { display: flex; align-items: center; gap: 8px; }
  .collapsible-header .arrow {
    display: inline-block; font-size: 11px; color: #888;
    transition: transform .2s; width: 12px; text-align: center;
  }
  .collapsible-header.open .arrow { transform: rotate(90deg); }
  .collapsible-body { margin-top: 12px; }

  .release-result {
    display: none; margin-top: 10px; padding: 10px 12px;
    border-radius: 8px; font-size: 13px; line-height: 1.5;
  }
  .release-result.show { display: block; }
  .release-result.success { background: #e6f4ea; color: #0f9d58; border: 1px solid #b7e0c4; }
  .release-result.error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }

  @media (max-width: 480px) {
    body { padding: 12px 10px 32px; font-size: 14px; }
    h1 { font-size: 18px; margin-bottom: 12px; }
    h2 { font-size: 15px; }
    .panel { padding: 14px; border-radius: 12px; margin-bottom: 12px; }
    textarea { height: 120px; font-size: 12.5px; }
    .input-single { font-size: 12.5px; padding: 12px; }
    button { font-size: 13px; padding: 9px 14px; min-height: 40px; }
    .btn-link { font-size: 13px; padding: 9px 14px; min-height: 40px; }

    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-group > button,
    .btn-group > a.btn-link {
      width: 100%; justify-content: center;
      display: inline-flex; align-items: center;
    }
    .btn-group > button:only-child { grid-column: 1 / -1; }

    .order-card { padding: 12px; }
    .card-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .card-actions > button {
      width: 100%; padding: 8px 6px; font-size: 12px; min-height: 36px;
    }

    .phone { font-size: 14px; }
    .link-box { font-size: 12px; padding: 8px; }
    .auth-card { padding: 24px 20px 20px; }
    .auth-card h3 { font-size: 17px; }
  }

  @media (max-width: 340px) {
    .card-actions { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- ========== 密码遮罩 ========== -->
<div id="auth-mask">
  <div class="auth-card">
    <h3>📱 短信订单管理面板</h3>
    <p class="auth-tip">请输入访问密码</p>
    <input type="password" id="auth-pwd" placeholder="输入密码" autocomplete="current-password" />
    <label class="auth-remember">
      <input type="checkbox" id="auth-remember" checked />
      <span>记住密码（下次自动登录）</span>
    </label>
    <button class="auth-btn" onclick="handleAuth()">进入面板</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- ========== 主页面内容 ========== -->
<div id="main-content" style="display:none;">

<h1>
  短信订单管理面板
  <a href="admin.html" class="btn-link gray" style="font-size:12.5px;padding:6px 12px;min-height:32px;">← 港卡订单面板</a>
</h1>

<!-- 批量粘贴区域 -->
<div class="panel">
  <div class="panel-header">
    <h2>批量粘贴订单</h2>
  </div>
  <textarea id="input" placeholder="每行格式：手机号----密码----接码接口&#10;例如：852-84304112----E84X59DSX----http://217api.com:9900/api/sms/getcode?token=d699792313b4e70b0b62310ca26dd668"></textarea>
  <div class="btn-group" style="margin-top: 12px;">
    <button id="btn-submit" onclick="parseOrders()">批量生成短码链接</button>
    <button id="btn-copy-all" class="btn-copy-all" style="display:none;" onclick="copyCurrentOrders(this)">复制当前批次短链</button>
    <a href="records.html" target="_blank" class="btn-link records-link">📊 总接收记录</a>
    <a href="https://oo55426.pages.dev/resolve." target="_blank" rel="noopener" class="btn-link">🔗 短链还原</a>
  </div>
  <div class="tip">
    自动清洗 <code>852</code> 区号与 <code>-</code> 分隔符；第二段密码会一并保存到后端 KV（不暴露在短链里）；
    释放按钮用于客户退款后作废链接；点击「总接收记录」可查看买家取号 / 验证码上报。
  </div>
</div>

<!-- 手动失效订单 -->
<div class="panel">
  <div class="panel-header">
    <h2>⚠️ 手动失效订单</h2>
  </div>
  <div class="tip" style="margin-top:0; margin-bottom:10px;">
    粘贴用户短链（或直接输入 oid），点击下方按钮即可让该订单立即失效。适用于客户退款、换单、或链接泄露等场景。
  </div>
  <input type="text" id="release-input" class="input-single"
         placeholder="粘贴短链，例如：https://xxx/sms.html?oid=ABC123&#10;或直接输入 oid：ABC123" />
  <div class="btn-group" style="margin-top: 12px;">
    <button class="btn-danger" onclick="releaseByShortLink()">🚫 立即失效该订单</button>
    <button class="btn-secondary" onclick="clearReleaseInput()">清空</button>
  </div>
  <div class="release-result" id="release-result"></div>
</div>

<!-- 单栏布局 -->
<div class="main-grid">

  <div class="col">
    <div class="panel">
      <div class="panel-header">
        <h2>本次生成结果</h2>
        <span id="current-count" class="time-badge"></span>
      </div>
      <div id="list">
        <div class="empty-tip">等待生成...</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header collapsible-header" onclick="toggleHistoryPanel()">
        <h2>
          <span class="arrow" id="history-arrow">▶</span>
          历史订单记录 (<span id="history-count">0</span>)
        </h2>
        <div class="btn-group" onclick="event.stopPropagation();">
          <button class="btn-secondary" onclick="copyAllHistoryLinks(this)">一键复制全部短链</button>
          <button class="btn-danger" onclick="clearHistory()">清空</button>
        </div>
      </div>
      <div class="scroll-box collapsible-body" id="history-body" style="display:none;">
        <div id="history-list"></div>
      </div>
    </div>
  </div>

</div>

</div><!-- /main-content -->

<script>
// ==================== 密码保护 ====================
const AUTH_PASSWORD = 'shinia299.';                 // ← 与旧面板保持一致，可自行修改
const AUTH_KEY_LOCAL = 'admin_sms_auth_pwd';
const AUTH_KEY_SESSION = 'admin_sms_auth_pwd_session';

function checkAuth() {
  return localStorage.getItem(AUTH_KEY_LOCAL) === AUTH_PASSWORD ||
         sessionStorage.getItem(AUTH_KEY_SESSION) === AUTH_PASSWORD;
}

function handleAuth() {
  const input = document.getElementById('auth-pwd');
  const remember = document.getElementById('auth-remember').checked;
  const errEl = document.getElementById('auth-error');
  const pwd = input.value;

  if (pwd === AUTH_PASSWORD) {
    if (remember) {
      localStorage.setItem(AUTH_KEY_LOCAL, pwd);
      sessionStorage.removeItem(AUTH_KEY_SESSION);
    } else {
      sessionStorage.setItem(AUTH_KEY_SESSION, pwd);
      localStorage.removeItem(AUTH_KEY_LOCAL);
    }
    errEl.textContent = '';
    hideAuthAndInit();
  } else {
    errEl.textContent = '密码错误，请重试';
    input.value = '';
    input.focus();
  }
}

function hideAuthAndInit() {
  document.getElementById('auth-mask').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
  initApp();
}

// ==================== 主应用逻辑 ====================
const INDEX_PAGE = 'sms.html';                       // ← 新用户端页面
const ORDER_API = 'https://www.oo55426.xyz/api/order';
const STORAGE_KEY = 'admin_sms_order_history';
const RELEASE_ACTION = 'release';

let generatedOrders = [];
let appInited = false;

function initApp() {
  if (appInited) return;
  appInited = true;

  renderHistory();
}

// ==================== 通用工具 ====================
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/**
 * 清洗手机号：852-84304112 / +852 8430 4112 / 85284304112 → 84304112
 */
function cleanPhone(rawPhone) {
  let p = String(rawPhone == null ? '' : rawPhone).trim();
  p = p.replace(/[\s\-()（）]/g, '');   // 去掉分隔符
  p = p.replace(/^\+/, '');            // 去掉 +
  if (p.startsWith('852') && p.length > 8) p = p.slice(3);
  return p;
}

function formatTime(timestamp) {
  const d = new Date(timestamp);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function toggleHistoryPanel() {
  const header = document.querySelector('.collapsible-header');
  const body = document.getElementById('history-body');
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'block';
  header.classList.toggle('open', !isOpen);
}

function extractOid(line) {
  const s = String(line || '').trim();
  if (!s) return '';
  try {
    const url = new URL(s);
    const oid = url.searchParams.get('oid');
    if (oid) return oid.trim();
  } catch (e) {}
  const m = s.match(/[?&]oid=([A-Za-z0-9]+)/);
  if (m) return m[1].trim();
  if (/^[A-Za-z0-9]{4,12}$/.test(s)) return s;
  return '';
}

// ==================== 手动失效 ====================
async function releaseByShortLink() {
  const input = document.getElementById('release-input');
  const raw = (input.value || '').trim();

  if (!raw) {
    showReleaseResult('error', '请先粘贴短链或 oid');
    return;
  }

  const oid = extractOid(raw);
  if (!oid) {
    showReleaseResult('error', '无法从输入中识别出 oid，请检查格式');
    return;
  }

  if (!confirm(`确定要让订单【${oid}】立即失效吗？\n失效后用户端链接会立刻打不开，此操作不可撤销。`)) {
    return;
  }

  showReleaseResult('success', `正在失效订单 ${oid} ...`);

  try {
    const res = await fetch(ORDER_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: RELEASE_ACTION, oid })
    });

    let data = {};
    try { data = await res.json(); } catch (e) {}

    if (!res.ok && data.error && !/not found|already|expired/i.test(data.error)) {
      throw new Error(data.error);
    }

    updateHistoryOrder(oid, { released: true, releasedAt: Date.now() });
    const cur = generatedOrders.find(o => o.oid === oid);
    if (cur) cur.released = true;
    renderCurrentOrders();
    renderHistory();

    showReleaseResult('success', `✅ 订单 ${oid} 已失效，用户端链接将立即打不开。`);
    input.value = '';
  } catch (err) {
    showReleaseResult('error', `❌ 失效失败：${err.message}`);
  }
}

function showReleaseResult(type, msg) {
  const el = document.getElementById('release-result');
  el.className = 'release-result show ' + type;
  el.textContent = msg;
}

function clearReleaseInput() {
  document.getElementById('release-input').value = '';
  const el = document.getElementById('release-result');
  el.className = 'release-result';
  el.textContent = '';
}

// ==================== 历史订单 ====================
function getHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function saveHistory(history) {
  if (history.length > 1000) history = history.slice(0, 1000);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function updateHistoryOrder(oid, patch) {
  const history = getHistory();
  const item = history.find(h => h.oid === oid);
  if (item) {
    Object.assign(item, patch);
    saveHistory(history);
  }
}

// ==================== 释放订单（卡片按钮） ====================
async function releaseOrder(oid, phone, btn) {
  if (!confirm(`确定要释放【${phone}】的订单吗？\n释放后用户端的链接会立即失效，请确认客户已退款或已过期。`)) {
    return;
  }

  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '释放中...';

  try {
    const res = await fetch(ORDER_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: RELEASE_ACTION, oid })
    });

    let data = {};
    try { data = await res.json(); } catch (e) {}

    if (!res.ok && data.error && !/not found|already|expired/i.test(data.error)) {
      throw new Error(data.error);
    }

    updateHistoryOrder(oid, { released: true, releasedAt: Date.now() });
    const cur = generatedOrders.find(o => o.oid === oid);
    if (cur) cur.released = true;

    renderCurrentOrders();
    renderHistory();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = oldText;
    alert('释放失败：' + err.message);
  }
}

// ==================== 渲染订单卡片 ====================
function renderOrderCard(item) {
  if (item.error) {
    return `
      <div class="order-card">
        <div class="order-top">
          <span class="phone">${escapeHtml(item.phone || '未知号码')}</span>
        </div>
        <div class="link-box" style="color:#c62828; border-color:#ffcdd2; background:#ffebee;">
          生成失败：${escapeHtml(item.error)}
        </div>
      </div>
    `;
  }

  const releasedClass = item.released ? 'released' : '';
  const releasedBadge = item.released ? '<span class="released-badge">已释放</span>' : '';
  const pwdBadge = item.password ? `<span class="pwd-badge">密码 ${escapeHtml(item.password)}</span>` : '';
  const releaseBtn = item.released
    ? '<button class="btn-release" disabled>已释放</button>'
    : `<button class="btn-release" onclick="releaseOrder('${item.oid}', '${escapeHtml(item.phone)}', this)">释放</button>`;

  return `
    <div class="order-card ${releasedClass}">
      <div class="order-top">
        <span class="phone">${escapeHtml(item.phone)}${releasedBadge}</span>
        ${pwdBadge}
      </div>
      <div class="link-box" title="${escapeHtml(item.userLink)}">${escapeHtml(item.userLink)}</div>
      <div class="card-actions">
        <button class="btn-copy" onclick="copyLink('${item.userLink}', this)">复制链接</button>
        <button class="btn-open" onclick="window.open('${item.userLink}', '_blank')">打开</button>
        ${releaseBtn}
      </div>
    </div>
  `;
}

function renderCurrentOrders() {
  const list = document.getElementById('list');
  const countEl = document.getElementById('current-count');
  const valid = generatedOrders.filter(o => !o.error);

  if (countEl) countEl.textContent = generatedOrders.length ? `${valid.length}/${generatedOrders.length} 成功` : '';

  if (!generatedOrders.length) {
    if (!list.querySelector('.empty-tip')) {
      list.innerHTML = '<div class="empty-tip">等待生成...</div>';
    }
    return;
  }
  list.innerHTML = generatedOrders.map(renderOrderCard).join('');
}

function renderHistory() {
  const history = getHistory();
  const container = document.getElementById('history-list');
  document.getElementById('history-count').textContent = history.length;

  if (history.length === 0) {
    container.innerHTML = '<div class="empty-tip">暂无历史订单记录</div>';
    return;
  }

  container.innerHTML = history.map(item => {
    const releasedClass = item.released ? 'released' : '';
    const releasedBadge = item.released ? '<span class="released-badge">已释放</span>' : '';
    const releaseBtn = item.released
      ? '<button class="btn-release" disabled>已释放</button>'
      : `<button class="btn-release" onclick="releaseOrder('${item.oid}', '${escapeHtml(item.phone)}', this)">释放</button>`;

    return `
      <div class="order-card ${releasedClass}">
        <div class="order-top">
          <span class="phone">${escapeHtml(item.phone)}${releasedBadge}</span>
          <span class="time-badge">${formatTime(item.createdAt)}</span>
        </div>
        <div class="link-box" title="${escapeHtml(item.userLink)}">${escapeHtml(item.userLink)}</div>
        <div class="card-actions">
          <button class="btn-copy" onclick="copyLink('${item.userLink}', this)">复制链接</button>
          <button class="btn-open" onclick="window.open('${item.userLink}', '_blank')">打开</button>
          ${releaseBtn}
        </div>
      </div>
    `;
  }).join('');
}

function clearHistory() {
  if (confirm('确定要清空所有历史记录吗？\n注意：这只会清空本地记录，不会释放线上订单。')) {
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
  }
}

// ==================== 批量生成短码 ====================
async function parseOrders() {
  const raw = document.getElementById('input').value.trim();
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.includes('----'));
  const list = document.getElementById('list');
  const btn = document.getElementById('btn-submit');
  const btnCopyAll = document.getElementById('btn-copy-all');

  list.innerHTML = '';
  generatedOrders = [];
  btnCopyAll.style.display = 'none';

  if (!lines.length) {
    list.innerHTML = '<div class="empty-tip" style="color:#c62828;">没有解析到有效订单（每行需包含 ---- 分隔符）</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = '正在批量分配短码...';

  const baseUrl = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}${INDEX_PAGE}`;

  for (const line of lines) {
    const parts = line.split('----');
    const rawPhone = (parts[0] || '').trim();
    const password = (parts[1] || '').trim();
    const apiUrl   = parts.slice(2).join('----').trim();
    const phone = cleanPhone(rawPhone);

    if (!apiUrl) {
      generatedOrders.push({ phone, error: '缺少接码接口链接' });
      continue;
    }
    if (!/^https?:\/\//i.test(apiUrl)) {
      generatedOrders.push({ phone, error: '接口链接格式不正确' });
      continue;
    }

    try {
      const res = await fetch(ORDER_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          phone,
          password,
          targetUrl: apiUrl,
          type: 'sms'
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '创建短码失败');

      // ★ 短链只带 oid，账号密码保存在后端 KV
      const userLink = `${baseUrl}?oid=${data.oid}`;
      generatedOrders.push({
        phone, password, apiUrl, userLink,
        oid: data.oid, createdAt: Date.now(), released: false
      });
    } catch (err) {
      generatedOrders.push({ phone, error: err.message });
    }
  }

  const history = getHistory();
  const newOrders = generatedOrders.filter(o => !o.error);
  history.unshift(...newOrders);
  saveHistory(history);

  btn.disabled = false;
  btn.textContent = '批量生成短码链接';

  if (newOrders.length > 0) {
    btnCopyAll.style.display = 'inline-block';
  }

  renderCurrentOrders();
  renderHistory();
}

// ==================== 复制工具 ====================
function copyLink(link, btn) {
  doCopy(link, btn, '已复制 ✓', 1500);
}

function copyCurrentOrders(btn) {
  const links = generatedOrders.filter(o => !o.error).map(o => o.userLink);
  if (!links.length) return;
  doCopy(links.join('\n'), btn, '短链已全部复制 ✓', 2000);
}

function copyAllHistoryLinks(btn) {
  const history = getHistory();
  const links = history.filter(h => !h.released).map(h => h.userLink);
  if (!links.length) {
    alert('暂无可复制的链接（已释放的不计入）');
    return;
  }
  doCopy(links.join('\n'), btn, '历史短链已全部复制 ✓', 2000);
}

function doCopy(text, btn, successMsg, duration) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
    const old = btn.textContent;
    btn.textContent = successMsg;
    setTimeout(() => btn.textContent = old, duration);
  };

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      const old = btn.textContent;
      btn.textContent = successMsg;
      setTimeout(() => btn.textContent = old, duration);
    }).catch(fallback);
  } else {
    fallback();
  }
}

// ==================== 启动 ====================
window.addEventListener('DOMContentLoaded', () => {
  const pwdInput = document.getElementById('auth-pwd');
  if (pwdInput) {
    pwdInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleAuth();
    });
  }

  if (checkAuth()) {
    hideAuthAndInit();
  } else {
    setTimeout(() => { if (pwdInput) pwdInput.focus(); }, 100);
  }
});
</script>
