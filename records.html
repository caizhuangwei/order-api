<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f5f6fa">
<title>接收记录总览</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 16px 14px 40px;
    background: #f5f6fa; color: #222;
    min-height: 100vh; font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== 密码遮罩 ========== */
  #auth-mask {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 99999; padding: 20px;
  }
  .auth-card {
    background: #fff; border-radius: 16px;
    padding: 28px 24px 22px; width: 100%; max-width: 360px;
    box-shadow: 0 10px 40px rgba(0,0,0,.2); text-align: center;
  }
  .auth-card h3 { font-size: 18px; margin: 0 0 6px; font-weight: 700; }
  .auth-tip { font-size: 13px; color: #888; margin: 0 0 18px; }
  .auth-card input[type="password"] {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid #d9d9d9; border-radius: 10px;
    font-size: 15px; outline: none; background: #fafbfc;
    transition: border-color .15s; margin-bottom: 12px; letter-spacing: 1px;
  }
  .auth-card input[type="password"]:focus { border-color: #7c3aed; background: #fff; }
  .auth-remember {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: #666; margin-bottom: 16px;
    cursor: pointer; user-select: none;
  }
  .auth-remember input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: #7c3aed; cursor: pointer; margin: 0;
  }
  .auth-card .auth-btn {
    width: 100%; padding: 12px;
    background: #7c3aed; color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background .15s, transform .1s; min-height: 46px;
  }
  .auth-card .auth-btn:hover { background: #6d28d9; }
  .auth-card .auth-btn:active { transform: scale(0.98); }
  .auth-error { color: #d93025; font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* ========== 主页面 ========== */
  h1 { font-size: 20px; margin: 0 0 14px; color: #1a1a1a; font-weight: 700; }

  .tabs {
    display: flex; gap: 8px; background: #fff;
    padding: 6px; border-radius: 12px; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .tab {
    flex: 1; padding: 11px 14px; border: none;
    background: transparent; color: #666;
    font-size: 14px; font-weight: 600; cursor: pointer;
    border-radius: 8px; transition: all .15s; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    white-space: nowrap;
  }
  .tab:hover:not(.active) { background: #f5f6fa; }
  .tab.active { background: #11998e; color: #fff; box-shadow: 0 2px 8px rgba(17,153,142,.3); }
  .tab .badge {
    display: inline-block; font-size: 11.5px; font-weight: 700;
    padding: 1px 7px; border-radius: 10px;
    background: #f0f2f5; color: #666; min-width: 22px; text-align: center;
  }
  .tab.active .badge { background: #fff; color: #11998e; }

  .toolbar {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 12px; align-items: center;
  }
  button {
    padding: 9px 16px; cursor: pointer; border: none;
    background: #11998e; color: #fff; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    transition: background .15s, transform .1s;
    white-space: nowrap; min-height: 38px; font-family: inherit;
  }
  button:disabled { background: #9aa0a6; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #0d7a72; }
  button:active:not(:disabled) { transform: scale(0.97); }
  .btn-secondary { background: #5f6368; }
  .btn-secondary:hover:not(:disabled) { background: #494c50; }
  .btn-copy-all { background: #0f9d58; }
  .btn-copy-all:hover:not(:disabled) { background: #0b8043; }
  .btn-verify-all { background: #d46b08; }
  .btn-verify-all:hover:not(:disabled) { background: #b35a06; }
  .btn-auto-on { background: #d93025; }
  .btn-auto-on:hover:not(:disabled) { background: #b31412; }
  .btn-debug-on { background: #1a73e8; }
  .btn-debug-on:hover:not(:disabled) { background: #1557b0; }

  .status-line {
    font-size: 12.5px; color: #999;
    margin-left: auto; white-space: nowrap;
  }
  .status-line .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #0f9d58; margin-right: 4px; vertical-align: middle;
  }
  .status-line.paused .dot { background: #9aa0a6; }

  .record-list { display: flex; flex-direction: column; gap: 10px; }

  .empty-tip {
    color: #999; font-size: 14px; padding: 60px 10px; text-align: center;
    background: #fff; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }

  .record-card {
    background: #fff; border-radius: 12px; padding: 14px 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
    display: flex; flex-direction: column; gap: 10px;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .record-card.claim {
    background: #f0faf8;
    border-left: 3px solid #11998e;
  }

  .record-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap;
  }
  .phone {
    font-weight: 700; font-size: 15px; color: #222;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.5px;
  }
  .time-badge { font-size: 12px; color: #999; font-weight: normal; }

  .code-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .code-badge {
    display: inline-block; font-size: 18px; background: #e6f4ea; color: #0f9d58;
    padding: 4px 12px; border-radius: 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-weight: 800; letter-spacing: 2px;
  }
  .claim-badge {
    display: inline-block; font-size: 13px; background: #fff7e6; color: #d46b08;
    padding: 4px 12px; border-radius: 8px;
    font-weight: 700; letter-spacing: .5px;
  }
  .btn-copy-sm {
    padding: 6px 12px; font-size: 12.5px; min-height: 32px; border-radius: 7px;
    background: #34a853;
  }
  .btn-copy-sm:hover:not(:disabled) { background: #2d9249; }

  .content {
    font-size: 13.5px; color: #555; line-height: 1.6;
    word-break: break-all; background: #fafbfc; padding: 8px 10px;
    border-radius: 8px; border: 1px solid #eef1f5;
  }

  /* ========== 链接区（短链 / 长链 / 核对） ========== */
  .verify-box {
    display: flex; flex-direction: column; gap: 8px;
    background: #f7f9fc;
    border: 1px dashed #d3dce8;
    border-radius: 9px;
    padding: 9px 10px;
  }
  .verify-row {
    display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap;
  }
  .verify-label {
    flex: 0 0 auto;
    font-size: 11.5px; font-weight: 700; color: #fff;
    background: #7c3aed; border-radius: 6px;
    padding: 3px 8px; line-height: 1.5; margin-top: 2px;
    min-width: 42px; text-align: center;
  }
  .verify-label.short    { background: #7c3aed; }
  .verify-label.long     { background: #1a73e8; }
  .verify-label.combined { background: #d46b08; }
  .verify-value {
    flex: 1 1 190px; min-width: 0;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12.5px; line-height: 1.6; color: #2b2b2b;
    background: #fff; border: 1px solid #eef1f5; border-radius: 7px;
    padding: 5px 9px;
    word-break: break-all; white-space: pre-wrap;
    user-select: all; -webkit-user-select: all;
  }
  .verify-value a { color: #1a73e8; text-decoration: none; }
  .verify-value a:hover { text-decoration: underline; }
  .verify-value.muted { color: #999; font-style: italic; font-family: inherit; }
  .verify-row .btn-copy-sm { flex: 0 0 auto; }

  /* ========== 调试面板 ========== */
  .debug-panel {
    background: #1e1e1e; color: #d4d4d4;
    border-radius: 8px; padding: 10px 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11.5px; line-height: 1.55;
    overflow-x: auto; max-height: 320px; overflow-y: auto;
    white-space: pre;
    border: 1px solid #333;
  }
  .debug-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; color: #1a73e8;
    margin-bottom: 4px;
  }

  @media (max-width: 480px) {
    body { padding: 12px 10px 32px; }
    h1 { font-size: 17px; }
    .tab { font-size: 13px; padding: 10px 10px; }
    .tab .badge { font-size: 11px; padding: 1px 6px; min-width: 20px; }
    button { font-size: 12.5px; padding: 9px 13px; min-height: 40px; }
    .status-line { font-size: 11.5px; }
    .record-card { padding: 12px; }
    .phone { font-size: 14px; }
    .code-badge { font-size: 16px; letter-spacing: 1.5px; padding: 3px 10px; }
    .content { font-size: 13px; }
    .verify-value { font-size: 12px; }
  }
</style>
</head>
<body>

<!-- ========== 密码遮罩 ========== -->
<div id="auth-mask">
  <div class="auth-card">
    <h3>📊 接收记录总览</h3>
    <p class="auth-tip">请输入访问密码</p>
    <input type="password" id="auth-pwd" placeholder="输入密码" autocomplete="current-password" />
    <label class="auth-remember">
      <input type="checkbox" id="auth-remember" checked />
      <span>记住密码（下次自动登录）</span>
    </label>
    <button class="auth-btn" onclick="handleAuth()">进入面板</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- ========== 主内容 ========== -->
<div id="main-content" style="display:none;">

  <h1>📊 接收记录总览</h1>

  <div class="tabs">
    <button class="tab active" data-tab="old" onclick="switchTab('old')">
      旧平台 (admin) <span class="badge" id="old-count">0</span>
    </button>
    <button class="tab" data-tab="new" onclick="switchTab('new')">
      新平台 (adminsms) <span class="badge" id="new-count">0</span>
    </button>
  </div>

  <div class="toolbar">
    <button onclick="refreshRecords(true)">🔄 刷新</button>
    <button id="btn-auto" class="btn-secondary" onclick="toggleAuto()">▶ 开启自动刷新</button>
    <button class="btn-verify-all" onclick="copyAllCombined(this)">📋 复制全部核对行</button>
    <button class="btn-copy-all" onclick="exportCSV()">📥 导出 CSV</button>
    <button id="btn-debug" class="btn-secondary" onclick="toggleDebug()">🔍 调试</button>
    <span class="status-line paused" id="status-line">
      <span class="dot"></span><span id="status-text">自动刷新已关闭</span>
    </span>
  </div>

  <div class="record-list" id="record-list">
    <div class="empty-tip">正在加载记录...</div>
  </div>

</div>

<script>
// ==================== 密码保护 ====================
const AUTH_PASSWORD = 'shinia299.';
const AUTH_KEY_LOCAL = 'records_auth_pwd';
const AUTH_KEY_SESSION = 'records_auth_pwd_session';

function checkAuth() {
  return localStorage.getItem(AUTH_KEY_LOCAL) === AUTH_PASSWORD ||
         sessionStorage.getItem(AUTH_KEY_SESSION) === AUTH_PASSWORD;
}

function handleAuth() {
  const input = document.getElementById('auth-pwd');
  const remember = document.getElementById('auth-remember').checked;
  const errEl = document.getElementById('auth-error');
  const pwd = input.value;

  if (pwd === AUTH_PASSWORD) {
    if (remember) {
      localStorage.setItem(AUTH_KEY_LOCAL, pwd);
      sessionStorage.removeItem(AUTH_KEY_SESSION);
    } else {
      sessionStorage.setItem(AUTH_KEY_SESSION, pwd);
      localStorage.removeItem(AUTH_KEY_LOCAL);
    }
    errEl.textContent = '';
    hideAuthAndInit();
  } else {
    errEl.textContent = '密码错误，请重试';
    input.value = '';
    input.focus();
  }
}

function hideAuthAndInit() {
  document.getElementById('auth-mask').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
  initApp();
}

// ==================== 配置 ====================
const REPORT_API = 'https://www.oo55426.xyz/api/report';
const INDEX_PAGE = 'index.html';
const AUTO_INTERVAL = 8000;

// ==================== 状态 ====================
let allOld = [];
let allNew = [];
let currentTab = 'old';
let autoTimer = null;
let appInited = false;
let debugMode = false;

// ==================== 初始化 ====================
function initApp() {
  if (appInited) return;
  appInited = true;
  refreshRecords(false);
}

// ==================== 分类 ====================
function splitRecords(list) {
  const oldRec = [];
  const newRec = [];
  if (!Array.isArray(list)) return { oldRec, newRec };
  for (const item of list) {
    if (!item || typeof item !== 'object') continue;
    if (item.type === 'sms' || item.type === 'claim') {
      newRec.push(item);
    } else {
      oldRec.push(item);
    }
  }
  return { oldRec, newRec };
}

// ==================== 短链 / 长链 提取 ====================
/**
 * 短链拼装方式与 admin.html 完全一致：
 *   `${origin}${path}/index.html?oid=xxx`
 * 长链来自记录里的 targetUrl（也兼容 longUrl / fullUrl 等常见字段名）
 */

// 从 admin.html 抄过来的 oid 提取逻辑
function extractOid(str) {
  const s = String(str || '').trim();
  if (!s) return '';
  try {
    const url = new URL(s);
    const oid = url.searchParams.get('oid');
    if (oid) return oid.trim();
  } catch (e) {}
  const m = s.match(/[?&]oid=([A-Za-z0-9]+)/);
  if (m) return m[1].trim();
  if (/^[A-Za-z0-9]{4,12}$/.test(s)) return s;
  return '';
}

// 从记录的各个可能字段里找 oid
function pickOid(item) {
  // 1) 直接字段
  if (item.oid) return String(item.oid).trim();
  if (item.orderId) return String(item.orderId).trim();
  if (item.order_id) return String(item.order_id).trim();

  // 2) 短链类字段
  const shortFields = [
    'shortUrl', 'short_url', 'shortLink', 'shortlink', 'short',
    'userLink', 'user_link', 'smsUrl', 'sms_url'
  ];
  for (const k of shortFields) {
    if (item[k]) {
      const oid = extractOid(item[k]);
      if (oid) return oid;
    }
  }

  // 3) 兜底：从 content 里捞
  if (item.content) {
    const oid = extractOid(item.content);
    if (oid) return oid;
  }
  return '';
}

// 短链拼装（与 admin.html 同款）
function buildShortUrl(oid) {
  if (!oid) return '';
  const base = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}${INDEX_PAGE}`;
  return `${base}?oid=${encodeURIComponent(oid)}`;
}

// 长链提取（记录里的原始 targetUrl）
const LONG_FIELD_CANDIDATES = [
  'targetUrl', 'target_url',
  'longUrl', 'long_url',
  'fullUrl', 'full_url',
  'resolvedUrl', 'resolved_url',
  'originalUrl', 'original_url',
  'apiUrl', 'api_url'
];
function pickLongUrl(item) {
  for (const k of LONG_FIELD_CANDIDATES) {
    const v = item[k];
    if (typeof v === 'string' && v.trim()) return v.trim();
  }
  return '';
}

// ==================== 拉取数据 ====================
async function refreshRecords(showTip) {
  try {
    const res = await fetch(REPORT_API, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const list = await res.json();
    const { oldRec, newRec } = splitRecords(list);
    allOld = oldRec;
    allNew = newRec;

    document.getElementById('old-count').textContent = oldRec.length;
    document.getElementById('new-count').textContent = newRec.length;

    renderList();

    if (showTip) {
      setStatusText('刚刚已刷新');
      setTimeout(() => setStatusText(autoTimer ? '自动刷新中…' : '自动刷新已关闭'), 1500);
    }
  } catch (err) {
    console.warn('拉取记录失败:', err);
    document.getElementById('record-list').innerHTML =
      '<div class="empty-tip" style="color:#c62828;">拉取失败：' + escapeHtml(err.message) + '</div>';
  }
}

function setStatusText(text) {
  document.getElementById('status-text').textContent = text;
}

// ==================== Tab 切换 ====================
function switchTab(tab) {
  if (tab !== 'old' && tab !== 'new') return;
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  renderList();
}

// ==================== 调试模式 ====================
function toggleDebug() {
  debugMode = !debugMode;
  const btn = document.getElementById('btn-debug');
  if (debugMode) {
    btn.textContent = '🔍 关闭调试';
    btn.classList.remove('btn-secondary');
    btn.classList.add('btn-debug-on');
  } else {
    btn.textContent = '🔍 调试';
    btn.classList.add('btn-secondary');
    btn.classList.remove('btn-debug-on');
  }
  renderList();
}

// ==================== 渲染 ====================
function renderList() {
  const el = document.getElementById('record-list');
  const list = currentTab === 'old' ? allOld : allNew;

  if (!list.length) {
    el.innerHTML = currentTab === 'old'
      ? '<div class="empty-tip">旧平台暂无接收记录</div>'
      : '<div class="empty-tip">新平台暂无接收记录</div>';
    return;
  }

  el.innerHTML = list.map((item, idx) => renderCard(item, idx)).join('');
}

function verifyRow(label, value, cls, isLink) {
  const safe = escapeHtml(value);
  const inner = isLink
    ? `<a href="${safe}" target="_blank" rel="noopener">${safe}</a>`
    : safe;
  return `
    <div class="verify-row">
      <span class="verify-label ${cls || ''}">${escapeHtml(label)}</span>
      <span class="verify-value">${inner}</span>
      <button class="btn-copy-sm" data-copy="${safe}" onclick="copyFromBtn(this)">复制</button>
    </div>`;
}

function renderCard(item, idx) {
  const isClaim = item.type === 'claim';
  const phone   = String(item.phone || '');
  const time    = String(item.time || '');
  const content = String(item.content || '');
  const code    = String(item.code || '');

  const oid      = pickOid(item);
  const shortUrl = buildShortUrl(oid);
  const longUrl  = pickLongUrl(item);

  // 核对行：手机号----长链（和之前约定的一致）
  const combined = (phone && longUrl) ? (phone + '----' + longUrl) : '';

  // 组装链接区（短链 + 长链 + 核对行）
  const rows = [];

  if (shortUrl) {
    rows.push(verifyRow('短链', shortUrl, 'short', true));
  } else if (oid) {
    rows.push(verifyRow('短链', '（oid 解析成功但拼链异常）', 'short', false));
  } else {
    rows.push(`
      <div class="verify-row">
        <span class="verify-label short">短链</span>
        <span class="verify-value muted">（无 oid，无法拼短链）</span>
      </div>`);
  }

  if (longUrl) {
    rows.push(verifyRow('长链', longUrl, 'long', true));
  } else {
    rows.push(`
      <div class="verify-row">
        <span class="verify-label long">长链</span>
        <span class="verify-value muted">（无 targetUrl）</span>
      </div>`);
  }

  if (combined) {
    rows.push(verifyRow('核对', combined, 'combined', false));
  }

  const verifyBox = `<div class="verify-box">${rows.join('')}</div>`;

  const debugHtml = debugMode
    ? `<div class="debug-title">🐞 原始 JSON</div>
       <div class="debug-panel">${escapeHtml(JSON.stringify(item, null, 2))}</div>`
    : '';

  if (isClaim) {
    return `
      <div class="record-card claim">
        <div class="record-top">
          <span class="phone">${escapeHtml(phone)}</span>
          <span class="time-badge">${escapeHtml(time)}</span>
        </div>
        <div class="code-row">
          <span class="claim-badge">📖 已取号</span>
        </div>
        ${verifyBox}
        ${debugHtml}
      </div>
    `;
  }

  return `
    <div class="record-card">
      <div class="record-top">
        <span class="phone">${escapeHtml(phone)}</span>
        <span class="time-badge">${escapeHtml(time)}</span>
      </div>
      <div class="code-row">
        <span class="code-badge">${escapeHtml(code)}</span>
        <button class="btn-copy-sm" data-copy="${escapeHtml(code)}" onclick="copyFromBtn(this)">复制验证码</button>
      </div>
      ${content ? `<div class="content">${escapeHtml(content)}</div>` : ''}
      ${verifyBox}
      ${debugHtml}
    </div>
  `;
}

// ==================== 复制 ====================
function copyFromBtn(btn) {
  const text = btn && btn.dataset ? (btn.dataset.copy || '') : '';
  if (!text) return;
  copyText(text, btn);
}

function copyText(text, btn) {
  if (!text) return;
  const done = () => {
    if (!btn) return;
    const old = btn.textContent;
    btn.textContent = '已复制 ✓';
    clearTimeout(btn._copyTimer);
    btn._copyTimer = setTimeout(() => { btn.textContent = old; }, 1500);
  };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
    done();
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

/** 一键复制当前 Tab 全部「手机号----长链」 */
function copyAllCombined(btn) {
  const list = currentTab === 'old' ? allOld : allNew;
  const lines = list.map(item => {
    const phone = String(item.phone || '');
    const url = pickLongUrl(item);
    return (phone && url) ? (phone + '----' + url) : '';
  }).filter(Boolean);

  if (!lines.length) { alert('当前 Tab 暂无可复制的核对信息'); return; }
  copyText(lines.join('\n'), btn);
}

// ==================== 自动刷新 ====================
function toggleAuto() {
  const btn = document.getElementById('btn-auto');
  const line = document.getElementById('status-line');
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    btn.textContent = '▶ 开启自动刷新';
    btn.classList.remove('btn-auto-on');
    btn.classList.add('btn-secondary');
    line.classList.add('paused');
    setStatusText('自动刷新已关闭');
  } else {
    refreshRecords(false);
    autoTimer = setInterval(() => refreshRecords(false), AUTO_INTERVAL);
    btn.textContent = '⏸ 关闭自动刷新';
    btn.classList.remove('btn-secondary');
    btn.classList.add('btn-auto-on');
    line.classList.remove('paused');
    setStatusText('自动刷新中…');
  }
}

// ==================== 导出 CSV ====================
function exportCSV() {
  const list = currentTab === 'old' ? allOld : allNew;
  if (!list.length) { alert('当前 Tab 暂无记录'); return; }

  const header = '手机号,类型,验证码,短信内容,时间,短链,长链\n';
  const rows = list.map(item => {
    const typeLabel = item.type === 'claim' ? '取号' : '验证码';
    const oid = pickOid(item);
    const shortUrl = buildShortUrl(oid);
    const longUrl  = pickLongUrl(item);
    const cols = [
      item.phone || '',
      typeLabel,
      item.code || '',
      item.content || '',
      item.time || '',
      shortUrl,
      longUrl
    ];
    return cols.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
  }).join('\n');

  const blob = new Blob(['\uFEFF' + header + rows], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const tag = currentTab === 'old' ? '旧平台' : '新平台';
  a.download = `接收记录_${tag}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ==================== 通用工具 ====================
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ==================== 启动 ====================
window.addEventListener('DOMContentLoaded', () => {
  const pwdInput = document.getElementById('auth-pwd');
  if (pwdInput) {
    pwdInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleAuth();
    });
  }
  if (checkAuth()) {
    hideAndInit();
  } else {
    setTimeout(() => { if (pwdInput) pwdInput.focus(); }, 100);
  }
});

function hideAndInit() {
  document.getElementById('auth-mask').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
  initApp();
}
