<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短信验证码接收</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { background: #ffffff; width: 100%; max-width: 460px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); padding: 24px; }
    .header { text-align: center; border-bottom: 1px solid #f0f0f0; padding-bottom: 18px; margin-bottom: 20px; }
    .title { font-size: 14px; color: #8c8c8c; font-weight: 500; margin-bottom: 6px; }
    .phone-box { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .phone { font-size: 28px; font-weight: 700; color: #1f1f1f; letter-spacing: 1px; }
    .copy-btn { background: #f0f5ff; color: #2f54eb; border: 1px solid #adc6ff; border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .copy-btn:hover { background: #2f54eb; color: #fff; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #52c41a; background: #f6ffed; border: 1px solid #b7eb8f; padding: 2px 10px; border-radius: 12px; margin-top: 8px; }
    .dot { width: 6px; height: 6px; background-color: #52c41a; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .sms-box { background: #fafafa; border: 1px dashed #d9d9d9; border-radius: 12px; padding: 20px; min-height: 160px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .code-display { font-size: 34px; font-weight: 800; color: #1677ff; letter-spacing: 4px; margin-bottom: 12px; }
    .sms-text { font-size: 14px; color: #333; line-height: 1.6; word-break: break-all; background: #fff; border: 1px solid #e8e8e8; padding: 12px; border-radius: 8px; width: 100%; text-align: left; }
    .waiting { color: #8c8c8c; font-size: 14px; line-height: 1.6; }
    .footer { margin-top: 18px; text-align: center; font-size: 12px; color: #bfbfbf; }
  </style>
</head>
<body>

<div class="card">
  <!-- 上方：手机号展示 -->
  <div class="header">
    <div class="title">目标手机号</div>
    <div class="phone-box">
      <span class="phone" id="phone-val">--</span>
      <button class="copy-btn" onclick="copyText('phone-val')">复制</button>
    </div>
    <div class="status-badge" id="status-tag">
      <span class="dot"></span>
      <span id="status-text">实时监听中（自动刷新）</span>
    </div>
  </div>

  <!-- 下方：验证码与短信正文展示 -->
  <div class="sms-box" id="content-container">
    <div class="waiting" id="wait-msg">正在等待短信接收，请稍候...</div>
  </div>

  <div class="footer">
    每 3 秒自动轮询一次，收到后立即展示
  </div>
</div>

<script>
  // 从 URL 读取订单短 ID
  const urlParams = new URLSearchParams(window.location.search);
  const orderId = urlParams.get('id');

  // 如果没有 id，显示提示
  if (!orderId) {
    document.getElementById('phone-val').innerText = '--';
    document.getElementById('content-container').innerHTML = '<div class="waiting">缺少订单 ID，请通过正确链接访问</div>';
    document.getElementById('status-text').innerText = '链接无效';
  }

  // 复制功能
  function copyText(elementId) {
    const text = document.getElementById(elementId).innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert('已复制到剪贴板！');
    });
  }

  // 轮询查询验证码（通过 id 走后端代理）
  async function fetchSms() {
    if (!orderId) return;

    try {
      const resp = await fetch(`/api/order?id=${encodeURIComponent(orderId)}`);
      const result = await resp.json();

      if (!resp.ok) {
        console.warn('接口错误:', result.error);
        // 若订单不存在或已过期，更新状态提示
        if (resp.status === 404) {
          document.getElementById('status-text').innerText = '订单不存在或已过期';
        }
        return;
      }

      const phone = result.phone;
      const smsContent = result.sms || '';

      // 更新手机号显示
      if (phone) {
        document.getElementById('phone-val').innerText = phone;
      }

      // 提取 4-8 位纯数字验证码
      const codeMatch = smsContent.match(/\b\d{4,8}\b/);

      // 判断收到短信并更新 UI
      if (smsContent && !smsContent.includes('等待') && !smsContent.includes('暂无') && smsContent.length > 5) {
        let html = '';
        if (codeMatch) {
          html += `<div class="code-display" id="extracted-code">${codeMatch[0]}</div>`;
          html += `<button class="copy-btn" style="margin-bottom:14px; padding: 6px 14px;" onclick="copyText('extracted-code')">复制验证码</button>`;
        }
        html += `<div class="sms-text">${smsContent}</div>`;

        document.getElementById('content-container').innerHTML = html;
        document.getElementById('status-text').innerText = '已成功获取短信';
      }
    } catch (err) {
      console.warn("轮询请求异常：", err);
    }
  }

  // 初次加载并开启每 3 秒轮询
  fetchSms();
  setInterval(fetchSms, 3000);
</script>
</body>
</html>
